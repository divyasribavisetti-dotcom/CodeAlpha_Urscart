{%extends 'store/base.html'%}{%block title%}Checkout · NovaCart{%endblock%}{%block content%}<section class="banner"><label>SECURE CHECKOUT</label><h1>Almost there.</h1></section><section class="section cart-layout"><form class="form-card" method="post">{%csrf_token%}<h2>Delivery details</h2><label>Full name<input name="full_name" value="{{user.get_full_name}}" required></label><label>Email<input type="email" name="email" value="{{user.email}}" required></label><label>Address<textarea name="address" rows="5" required placeholder="House / street / city / state / PIN"></textarea></label><button class="btn">Place order · ₹{{total}}</button></form><aside class="summary"><label>YOUR ORDER</label>{%for i in items%}<p>{{i.product.name}} × {{i.quantity}} <b>₹{{i.subtotal}}</b></p>{%endfor%}<hr><p><strong>Total</strong><strong>₹{{total}}</strong></p></aside></section>{%endblock%}
